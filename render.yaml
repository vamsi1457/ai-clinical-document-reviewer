# Render Blueprint for AI Clinical Document Reviewer
# https://render.com/docs/blueprint-spec

services:
  # 1. Backend Web Service (FastAPI + Python + OCR)
  - type: web
    name: ai-clinical-reviewer-backend
    runtime: python
    rootDir: ai-clinical-document-reviewer/backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: clinical-db
          property: connectionString
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-3.5-flash-lite
      - key: AI_API_KEY
        sync: false # Set securely in Render dashboard
      - key: CORS_ORIGINS
        value: "*"

  # 2. Frontend Web UI (React + Vite static site)
  - type: web
    name: ai-clinical-reviewer-frontend
    runtime: static
    rootDir: ai-clinical-document-reviewer/frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: ai-clinical-reviewer-backend
          property: host

databases:
  # 3. Managed PostgreSQL Database
  - name: clinical-db
    databaseName: clinical_db
    user: clinical_user
    plan: free
